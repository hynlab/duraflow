[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "duraflow"
version = "1.0.1"
description = "Independent Python durable workflow engine with replay, Pulsar, PostgreSQL and SQLite"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Duraflow contributors"}]
dependencies = [
    "pydantic>=2.13.4,<2.14",
    "SQLAlchemy[asyncio]>=2.0.36,<2.1",
    "psycopg[binary]>=3.2,<4",
    "pulsar-client>=3.6,<4",
]
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed"]

[project.optional-dependencies]
# Compatibility aliases: adapters are included in the base installation.
postgres = []
pulsar = []
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-cov>=7,<8", "pytest-timeout>=2.4,<3", "coverage[toml]>=7.10.6,<8", "hypothesis>=6,<7", "ruff>=0.11,<1", "mypy>=1.15,<2", "build>=1.2,<2"]

[project.scripts]
duraflow = "duraflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
duraflow = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 180
timeout_method = "thread"
markers = ["fault: destructive tests on explicitly opted-in isolated Compose services", "integration: requires native PostgreSQL and/or Pulsar services"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/test_properties.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
files = ["src/duraflow"]
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["duraflow"]
patch = ["subprocess"]
relative_files = true

[tool.coverage.report]
show_missing = true
