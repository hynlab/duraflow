[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "duraflow"
version = "0.1.0a1"
description = "Independent Python durable workflow engine with replay, Pulsar and PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Duraflow contributors"}]
dependencies = ["pydantic>=2.13.4,<2.14"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Typing :: Typed"]

[project.optional-dependencies]
postgres = ["SQLAlchemy[asyncio]>=2.0.36,<2.1", "psycopg[binary]>=3.2,<4"]
pulsar = ["pulsar-client>=3.6,<4"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-cov>=5,<8", "hypothesis>=6,<7", "ruff>=0.11,<1", "mypy>=1.15,<2", "build>=1.2,<2"]

[project.scripts]
duraflow = "duraflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
duraflow = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires native PostgreSQL and/or Pulsar services"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/test_properties.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
files = ["src/duraflow"]
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["duraflow"]

[tool.coverage.report]
show_missing = true
