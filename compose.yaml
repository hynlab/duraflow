services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: duraflow
      POSTGRES_PASSWORD: development-only
      POSTGRES_DB: duraflow
    ports: ["127.0.0.1:${DURAFLOW_POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duraflow -d duraflow"]
      interval: 3s
      timeout: 3s
      retries: 30
  pulsar:
    image: apachepulsar/pulsar:4.0.3
    command:
      - sh
      - -c
      - bin/apply-config-from-env.py conf/standalone.conf && exec bin/pulsar standalone --advertised-address localhost --no-functions-worker --no-stream-storage
    environment:
      PULSAR_MEM: "-Xms512m -Xmx512m -XX:MaxDirectMemorySize=512m"
      PULSAR_PREFIX_brokerServicePort: "${DURAFLOW_PULSAR_PORT:-6650}"
    ports: ["127.0.0.1:${DURAFLOW_PULSAR_PORT:-6650}:${DURAFLOW_PULSAR_PORT:-6650}", "127.0.0.1:${DURAFLOW_PULSAR_ADMIN_PORT:-8080}:8080"]
    volumes: ["pulsar-data:/pulsar/data"]
    healthcheck:
      test: ["CMD", "bin/pulsar-admin", "brokers", "healthcheck"]
      interval: 10s
      timeout: 30s
      retries: 30
volumes:
  postgres-data:
  pulsar-data:
