name: Protocol-2 sustained qualification
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Sustained workload duration (seconds, 1..3600)
        required: true
        default: '1800'
permissions:
  contents: read
concurrency:
  group: message-soak-${{ github.ref }}
  cancel-in-progress: false
jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      COMPOSE_PROJECT_NAME: duraflow-qualification-soak-${{ github.run_id }}
      DURAFLOW_TEST_POSTGRES: postgresql+psycopg://duraflow:development-only@localhost:5432/duraflow
      DURAFLOW_TEST_PULSAR: pulsar://localhost:6650
      SOAK_SECONDS: ${{ inputs.seconds }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bounded duration
        run: |
          python - <<'PY'
          import os
          value = os.environ['SOAK_SECONDS']
          assert value.isdecimal() and 1 <= int(value) <= 3600
          PY
      - run: python -m pip install -e '.[dev]'
      - run: docker compose up -d --wait --wait-timeout 240
      - run: make message-soak-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-2-soak-evidence
          path: |
            soak-results.json
            qualification-artifacts/
      - name: Stop owned infrastructure
        if: always()
        run: docker compose down -v
