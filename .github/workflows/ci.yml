name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    uses: ./.github/workflows/hardening.yml
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: make format-check
      - run: make lint
      - run: make typecheck
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: make test
      - run: python examples/quickstart.py && python examples/broadcast_join.py
      - run: python -m build
      - name: Inspect built distributions
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          wheel = next(Path('dist').glob('*.whl'))
          with zipfile.ZipFile(wheel) as z:
              assert 'duraflow/py.typed' in z.namelist()
              metadata = z.read(next(n for n in z.namelist() if n.endswith('/METADATA'))).decode()
              assert 'License-Expression: Apache-2.0' in metadata
              assert any(n.endswith('/licenses/LICENSE') for n in z.namelist())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-python-${{ matrix.python }}
          path: dist/*
  native-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: docker compose up -d --wait --wait-timeout 240
      - name: Required native services and frozen-codec compatibility
        env:
          DURAFLOW_TEST_POSTGRES: postgresql+psycopg://duraflow:development-only@localhost:5432/duraflow
          DURAFLOW_TEST_PULSAR: pulsar://localhost:6650
        run: make native-check
      - name: Capture infrastructure diagnostics
        if: failure()
        run: docker compose logs --tail=150
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-coverage
          path: |
            coverage.xml
            coverage.json
            native-results.xml
          if-no-files-found: ignore
      - name: Stop development infrastructure
        if: always()
        run: docker compose down -v
  base-install:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build && python -m build
      - name: Install base wheel without extras
        run: |
          python -m venv "$RUNNER_TEMP/base-install"
          "$RUNNER_TEMP/base-install/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/base-install/bin/python" -m pip check
          "$RUNNER_TEMP/base-install/bin/python" -I -c 'import pulsar, psycopg, sqlalchemy, sqlite3; from duraflow import Runtime, RuntimeSettings'
          "$RUNNER_TEMP/base-install/bin/duraflow" --help
  compose-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start the documented demo
        run: docker compose -f docker-compose/compose.yaml up --build -d --wait --wait-timeout 300
      - name: Execute and recover the example
        run: |
          test "$(docker compose -f docker-compose/compose.yaml run --rm -T client)" = "22"
          docker compose -f docker-compose/compose.yaml restart workflow-engine
          test "$(docker compose -f docker-compose/compose.yaml run --rm -T client)" = "22"
      - name: Capture demo diagnostics
        if: failure()
        run: docker compose -f docker-compose/compose.yaml logs --tail=100
      - name: Stop the demo
        if: always()
        run: docker compose -f docker-compose/compose.yaml down -v
